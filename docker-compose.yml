x-api-base: &api-base
  build: .
  image: jungle-challenge:local
  env_file: .env.docker
  depends_on:
    migrate:
      condition: service_completed_successfully
    localstack:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/health/ready'); if(!r.ok)process.exit(1)"]
    interval: 3s
    timeout: 5s
    start_period: 15s
    retries: 30
  restart: on-failure

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
      POSTGRES_DB: jungle_wagering
    ports:
      - "${PG_PORT:-55432}:5432"
    volumes:
      - jungle_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_wagering"]
      interval: 3s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.10
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - "${SQS_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:4566/_localstack/health',timeout=2))['services']['sqs'] in ('available','running')"]
      interval: 3s
      timeout: 5s
      start_period: 15s
      retries: 30

  migrate:
    build: .
    image: jungle-challenge:local
    env_file: .env.docker
    command: ["bun", "run", "migration:up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api1:
    <<: *api-base
    ports: ["${API1_PORT:-3001}:3000"]
  api2:
    <<: *api-base
    ports: ["${API2_PORT:-3002}:3000"]
  api3:
    <<: *api-base
    ports: ["${API3_PORT:-3003}:3000"]

  worker1:
    <<: *api-base
    ports: ["${WORKER1_PORT:-9091}:9090"]
    command: ["bun", "run", "start:worker"]
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:9090/health/ready'); if(!r.ok)process.exit(1)"]
      interval: 3s
      timeout: 5s
      start_period: 15s
      retries: 30
  worker2:
    <<: *api-base
    ports: ["${WORKER2_PORT:-9092}:9090"]
    command: ["bun", "run", "start:worker"]
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:9090/health/ready'); if(!r.ok)process.exit(1)"]
      interval: 3s
      timeout: 5s
      start_period: 15s
      retries: 30

  frontend:
    build: ./frontend
    image: jungle-challenge-frontend:local
    ports: ["${FRONTEND_PORT:-5173}:80"]
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
    restart: on-failure

volumes:
  jungle_postgres:
