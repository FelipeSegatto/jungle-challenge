server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Mesmo contrato de proxy do vite.config.ts (dev): /api/node-N/* -> instância N, sem o prefixo.
  location /api/node-1/ {
    rewrite ^/api/node-1/(.*)$ /$1 break;
    proxy_pass http://api1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/node-2/ {
    rewrite ^/api/node-2/(.*)$ /$1 break;
    proxy_pass http://api2:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/node-3/ {
    rewrite ^/api/node-3/(.*)$ /$1 break;
    proxy_pass http://api3:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
